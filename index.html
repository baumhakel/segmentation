<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bildsegmentierung</title>
<style>
/* Alle Regeln sind auf #segapp beschränkt: eingebettet in eine fremde Seite (z. B. TYPO3)
   beeinflusst die App die Seite nicht und umgekehrt. */
#segapp{
  --bg:#f4f4f1; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dddcd6;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ebf3; --warn:#c0532f; --stage:#262624;
  --perim:#1f78ff; --scale:#d61f8f; --centroid:#ff8c00; --hole:#4f8fd6; --other:#e88c73;
  display:block;position:relative;width:100%;max-width:100%;min-width:0;
  height:100vh;height:min(100svh,900px);min-height:520px;
  overflow:hidden;overflow:clip;container-type:size;
  background:var(--bg);color:var(--ink);text-align:left;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:normal;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
#segapp *,#segapp *::before,#segapp *::after{box-sizing:border-box;margin:0;font-family:inherit;letter-spacing:inherit;text-transform:none;float:none}
#segapp.sa-full{position:fixed;inset:0;width:auto;height:auto;max-height:none;min-height:0;z-index:2147483000}
#segapp.sa-standalone{height:100vh;height:100dvh;min-height:0}
html.sa-standalone,html.sa-standalone body{margin:0;padding:0;height:100%;overflow:hidden;background:#f4f4f1}
html.sa-noscroll,html.sa-noscroll body{overflow:hidden !important}

#segapp .sa-app{display:grid;height:100%;max-width:900px;margin:0 auto;background:var(--panel);
  grid-template-rows:minmax(160px,48%) auto minmax(0,1fr);
  grid-template-rows:minmax(160px,min(48cqh,76cqw)) auto minmax(0,1fr)}
#segapp #stage{background:var(--stage);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;min-width:0}
#segapp #view{position:absolute;left:0;top:0;display:none;max-width:none;max-height:none;border:0;-webkit-touch-callout:none}
#segapp .ovl{position:absolute;top:.5em;min-height:36px;padding:.35em .65em;border:0;border-radius:8px;
  background:rgba(20,20,18,.66);color:#fff;font-size:.85em;font-variant-numeric:tabular-nums;box-shadow:none}
#segapp #zbtn{right:.5em}
#segapp #fsbtn{left:.5em}
#segapp .ovl[hidden]{display:none}
#segapp #placeholder{color:#a9a8a2;text-align:center;padding:1em;font-size:.95em}
#segapp #toolbar{display:flex;gap:.5em;padding:.5em .75em;border-bottom:1px solid var(--line);align-items:center;min-width:0}
#segapp #toolbar .info{margin-left:auto;color:var(--muted);font-size:.8em;text-align:right;line-height:1.25;min-width:0}
#segapp #toolbar button{padding:.6em .7em;white-space:nowrap;flex:none}
#segapp #panel{overflow-y:auto;min-width:0;padding:.6em .75em calc(1.25em + env(safe-area-inset-bottom))}
#segapp h2{font-size:1.05em;font-weight:700;line-height:1.3;color:var(--ink);margin:.1em 0 .6em;padding:0;border:0;background:none}
#segapp p{font-size:inherit;line-height:1.4}
#segapp button,#segapp .btn{font:inherit;font-size:.95em;line-height:1.25;border:1px solid var(--line);background:#fafaf8;color:var(--ink);border-radius:10px;
  padding:.6em .85em;min-height:44px;min-width:0;width:auto;height:auto;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  display:inline-flex;align-items:center;justify-content:center;text-align:center;white-space:normal;touch-action:manipulation;
  box-shadow:none;text-decoration:none;font-weight:400;vertical-align:middle}
#segapp button:disabled{opacity:.38;cursor:default}
#segapp button.primary,#segapp .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#segapp button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
#segapp .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em}
#segapp .wide{grid-column:1 / -1}
#segapp .row{display:flex;gap:.5em;align-items:center;margin:.5em 0;min-width:0}
#segapp .row input[type=range]{flex:1;min-width:0;width:auto;height:32px;margin:0;padding:0;accent-color:var(--accent);background:none;border:0}
#segapp .row input[type=text]{width:6.5em;min-width:0;font:inherit;font-size:16px;padding:.5em .6em;border:1px solid var(--line);border-radius:8px;min-height:44px;background:#fff;color:var(--ink)}
#segapp .row label{font-size:.95em;display:inline;margin:0;font-weight:400}
#segapp .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35em;margin-bottom:.5em}
#segapp .seg button{padding:.5em .2em;font-size:.85em}
#segapp .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em;margin-top:.75em}
#segapp .hint{color:var(--muted);font-size:.88em;margin:.6em 0}
#segapp .hint.warn{color:var(--warn)}
#segapp .readout{font-size:.92em;margin:.25em 0}
#segapp .history{font-size:.8em;color:var(--muted);border-top:1px solid var(--line);padding-top:.5em;margin-top:.75em;overflow-wrap:anywhere}
#segapp #hist{width:100%;max-width:100%;height:100px;display:block;touch-action:none;border:1px solid var(--line);border-radius:8px;background:#fcfcfa}
#segapp .legend{display:flex;gap:.3em .9em;flex-wrap:wrap;font-size:.8em;color:var(--muted);margin:.35em 0}
#segapp .sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-1px;margin-right:.3em;flex:none;font-style:normal}
#segapp label.check{display:inline-flex;gap:.4em;align-items:center;font-size:.9em;margin:0 0 0 auto;font-weight:400}
#segapp label.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
#segapp .se{display:flex;gap:.75em;align-items:center;font-size:.85em;color:var(--muted)}
#segapp #se{image-rendering:pixelated;border:1px solid var(--line);background:#fff;max-width:none}
#segapp .sa-file{display:none}
#segapp .start{display:flex;flex-direction:column;gap:.75em}
#segapp .start .btn{min-height:56px;font-size:1.05em}
#segapp .steps{display:flex;gap:.25em;list-style:none;padding:0;margin:0 0 .65em;font-size:.74em}
#segapp .steps li{flex:1 1 0;min-width:0;text-align:center;padding:.28em .15em;margin:0;border-radius:6px;background:#efeee9;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;list-style:none}
#segapp .steps li::before,#segapp .steps li::marker{content:none}
#segapp .steps li.now{background:var(--accent);color:#fff;font-weight:600;flex-grow:2.2}
#segapp .steps li.done{background:var(--accent-soft);color:var(--accent)}
#segapp .meas{display:flex;flex-direction:column;gap:.4em}
#segapp .mrow{display:grid;grid-template-columns:1.1em auto minmax(0,1fr);column-gap:.3em;align-items:center;justify-items:start;text-align:left;width:100%;
  padding:.55em .7em;border:1px solid var(--line);border-radius:10px;min-height:44px;font-size:.95em;background:#fafaf8}
#segapp .mrow .mval{justify-self:end;text-align:right;font-variant-numeric:tabular-nums}
#segapp button.mrow[aria-pressed="false"]{opacity:.55}
#segapp button.mrow[aria-pressed="false"] .sw{background:transparent !important;outline:2px solid currentColor;outline-offset:-2px}
#segapp .copied{font-size:.85em;color:var(--accent);margin:.5em 0 0;min-height:1.2em}
#segapp b{font-weight:700}
/* schmale Spalten (z. B. Handy mit Seitenrändern) */
@container (max-width: 420px){
  #segapp .steps li:not(.now) .lbl{display:none}
  #segapp .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container (max-width: 360px){
  #segapp #toolbar .info{display:none}
}
</style>
</head>
<body>
<!-- ======== Bildsegmentierung: Beginn (für TYPO3 & Co. kann die ganze Datei eingefügt werden) ======== -->
<div id="segapp"><div class="sa-app">
<div id="stage">
  <canvas id="view"></canvas>
  <button id="fsbtn" class="ovl" hidden>⛶ Vollbild</button>
  <button id="zbtn" class="ovl" hidden aria-label="Ganzes Bild zeigen"></button>
  <div id="placeholder">Noch kein Bild.<br>Unten ein Foto aufnehmen oder auswählen.</div>
</div>
<div id="toolbar">
  <button id="undo" disabled>↶ Zurück</button>
  <button id="redo" disabled aria-label="Wiederholen">Vor ↷</button>
  <button id="compare" disabled>Original ◐</button>
  <div class="info" id="info"></div>
</div>
<div id="panel"></div>
<input type="file" id="sa-file" class="sa-file" accept="image/*">
</div></div>
<script>
(() => {
"use strict";
const MAX_SIDE = 800;           // längste Bildseite nach dem Verkleinern
const root = document.getElementById('segapp');
const $ = s => root.querySelector(s);                 // nur innerhalb der App suchen
const css = name => getComputedStyle(root).getPropertyValue(name).trim();

/* ---------- Eigenständig oder eingebettet ---------- */
// Eigenständig: die App ist das einzige Element der Seite (direkt im <body>).
// Eingebettet (z. B. TYPO3): die App reserviert einen Block in der Seite; "Vollbild" legt sie über die ganze Seite.
const standalone = root.parentElement === document.body;
if (standalone){ document.documentElement.classList.add('sa-standalone'); root.classList.add('sa-standalone'); }
const fsbtn = $('#fsbtn');
let fsHome = null;
function setFull(on){
  if (on === !!fsHome) return;
  if (on){
    // an den <body> hängen, damit position:fixed nicht von Elternelementen der Seite beeinflusst wird
    fsHome = document.createComment('segapp'); root.parentNode.insertBefore(fsHome, root);
    document.body.appendChild(root); root.classList.add('sa-full'); document.documentElement.classList.add('sa-noscroll');
  } else {
    fsHome.parentNode.insertBefore(root, fsHome); fsHome.remove(); fsHome = null;
    root.classList.remove('sa-full'); document.documentElement.classList.remove('sa-noscroll');
    root.scrollIntoView({ block: 'start' });
  }
  fsbtn.textContent = on ? '✕ Vollbild' : '⛶ Vollbild';
  fsbtn.setAttribute('aria-label', on ? 'Vollbild beenden' : 'Vollbild');
}
if (!standalone){
  fsbtn.hidden = false;
  fsbtn.addEventListener('click', () => setFull(!fsHome));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && fsHome) setFull(false); });
}

// Zustand: Stapel von Bildern (für "Zurück"). Graustufen: Werte 0..255.
// Binärbild (Maske): 0 = Objekt (schwarz), 255 = Hintergrund (weiß).
const S = { stack: [], redo: [], orig: null, origRot: null, tool: null, comparing: false, scale: null };
const curState = () => S.stack[S.stack.length - 1];
const Z = { z: 1, x: 0, y: 0 };   // Zoom (relativ zum ganzen Bild) und Verschiebung
const origFor = cur => cur.rot ? S.origRot : S.orig;

/* ---------- Anzeige ---------- */
const view = $('#view'), vctx = view.getContext('2d');
let vImg = null;
function ensureSize(w, h){
  if (view.width !== w || view.height !== h || !vImg){
    view.width = w; view.height = h; vImg = vctx.createImageData(w, h);
  }
}
function paintGrey(px, w, h){
  ensureSize(w, h); const d = vImg.data;
  for (let i = 0, j = 0; i < px.length; i++, j += 4){ const v = px[i]; d[j]=v; d[j+1]=v; d[j+2]=v; d[j+3]=255; }
  vctx.putImageData(vImg, 0, 0);
}
function paintRGBA(buf, w, h){ ensureSize(w, h); vImg.data.set(buf); vctx.putImageData(vImg, 0, 0); }

// Maske, die "jetzt" gilt: Vorschau des offenen Werkzeugs, sonst das aktuelle Binärbild
function currentMask(){
  const t = S.tool, cur = curState();
  if (t && t.mask) return t.mask;
  return cur && cur.binary ? cur.px : null;
}
// Originalfoto, Maske halbtransparent rot darüber
function paintOverlay(){
  const cur = curState(), o = origFor(cur), mask = currentMask();
  const buf = new Uint8ClampedArray(o.data);
  if (mask) for (let i = 0, j = 0; i < mask.length; i++, j += 4){
    if (mask[i] === 0){ buf[j] = buf[j]*0.45 + 140; buf[j+1] = buf[j+1]*0.45; buf[j+2] = buf[j+2]*0.45; }
  }
  paintRGBA(buf, o.width, o.height);
}

function redraw(){
  const cur = curState(); if (!cur) return;
  view.style.display = 'block'; $('#placeholder').style.display = 'none';
  applyZoom();
  if (S.comparing) return paintOverlay();
  const t = S.tool;
  if (t && t.name === 'result') return drawResult(t);
  if (t && t.rgba) paintRGBA(t.rgba, cur.w, cur.h);
  else if (t && t.mask) paintGrey(t.mask, cur.w, cur.h);
  else paintGrey(cur.px, cur.w, cur.h);
}

let pending = false;
function schedule(){
  if (pending) return; pending = true;
  requestAnimationFrame(() => { pending = false; computePreview(); redraw(); updateReadouts(); });
}

/* ---------- Bild laden ---------- */
async function loadFile(file){
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
  const s = Math.min(1, MAX_SIDE / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * s)), h = Math.max(1, Math.round(sh * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h), d = id.data;
  const grey = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < grey.length; i++, j += 4) grey[i] = Math.round(0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2]);
  // gedrehte Kopie des Farbbilds (für Vergleich und Ergebnis nach 180°-Drehung)
  const rot = new ImageData(w, h), r = rot.data, n = w * h;
  for (let i = 0; i < n; i++){ const a = i*4, b = (n-1-i)*4; r[b]=d[a]; r[b+1]=d[a+1]; r[b+2]=d[a+2]; r[b+3]=255; }
  S.orig = id; S.origRot = rot; S.tool = null; S.redo = []; S.scale = null; Z.z = 1;
  S.stack = [{ px: grey, w, h, binary: false, rot: false, label: 'Graustufen' }];
  refresh();
}
$('#sa-file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) loadFile(f).catch(() => alert('Das Bild konnte nicht geladen werden.'));
});

/* ---------- Bildverarbeitung ---------- */
function histogram(px){ const h = new Uint32Array(256); for (let i = 0; i < px.length; i++) h[px[i]]++; return h; }

function otsu(hist, total){
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = -1, bestT = 127;
  for (let t = 0; t < 256; t++){
    wB += hist[t]; sumB += t * hist[t];
    if (!wB) continue; const wF = total - wB; if (!wF) break;
    const mB = sumB / wB, mF = (sum - sumB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > best){ best = v; bestT = t; }
  }
  return bestT;
}

// Binäre Erosion/Dilatation mit Kreisscheibe vom Radius r (Zeilen-Präfixsummen).
// Pixel außerhalb des Bildes werden ignoriert.
function morph(src, w, h, r, erode){
  const W = w + 1, pre = new Int32Array(W * h);
  for (let y = 0; y < h; y++){ let s = 0; for (let x = 0; x < w; x++){ s += src[y*w+x] === 0 ? 1 : 0; pre[y*W+x+1] = s; } }
  const half = []; for (let dy = -r; dy <= r; dy++) half.push(Math.floor(Math.sqrt(r*r - dy*dy)));
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      let res = erode;
      for (let k = 0; k < half.length; k++){
        const yy = y + k - r; if (yy < 0 || yy >= h) continue;
        const a = Math.max(0, x - half[k]), b = Math.min(w - 1, x + half[k]);
        const cnt = pre[yy*W+b+1] - pre[yy*W+a];
        if (erode){ if (cnt !== b - a + 1){ res = false; break; } }
        else if (cnt > 0){ res = true; break; }
      }
      out[y*w+x] = res ? 0 : 255;
    }
  }
  return out;
}
function applyMorph(px, w, h, op, r){
  if (op === 'erode')  return morph(px, w, h, r, true);
  if (op === 'dilate') return morph(px, w, h, r, false);
  if (op === 'open')   return morph(morph(px, w, h, r, true), w, h, r, false);
  return morph(morph(px, w, h, r, false), w, h, r, true);   // close
}

// Zusammenhangskomponenten (8er-Nachbarschaft) der Objektpixel
function components(px, w, h){
  const lab = new Int32Array(w * h), q = new Int32Array(w * h), sizes = [0];
  let n = 0;
  for (let i = 0; i < px.length; i++){
    if (px[i] !== 0 || lab[i]) continue;
    n++; let head = 0, tail = 0; q[tail++] = i; lab[i] = n;
    while (head < tail){
      const p = q[head++], x = p % w, y = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++){ const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++){ const xx = x + dx; if (xx < 0 || xx >= w) continue;
          const nb = yy*w + xx; if (px[nb] === 0 && !lab[nb]){ lab[nb] = n; q[tail++] = nb; } } }
    }
    sizes.push(tail);
  }
  let best = 0; for (let k = 1; k <= n; k++) if (!best || sizes[k] > sizes[best]) best = k;
  return { lab, n, sizes, best };
}

// Löcher = Hintergrundbereiche (4er-Nachbarschaft), die den Bildrand nicht berühren
function fillHoles(px, w, h){
  const reach = new Uint8Array(w * h), q = new Int32Array(w * h);
  let head = 0, tail = 0;
  const seed = i => { if (px[i] !== 0 && !reach[i]){ reach[i] = 1; q[tail++] = i; } };
  for (let x = 0; x < w; x++){ seed(x); seed((h-1)*w + x); }
  for (let y = 0; y < h; y++){ seed(y*w); seed(y*w + w - 1); }
  while (head < tail){
    const p = q[head++], x = p % w, y = (p / w) | 0;
    if (x > 0) seed(p-1); if (x < w-1) seed(p+1); if (y > 0) seed(p-w); if (y < h-1) seed(p+w);
  }
  const mask = px.slice(), seen = new Uint8Array(w * h);
  let holes = 0, holePx = 0;
  for (let i = 0; i < px.length; i++){
    if (px[i] === 0 || reach[i]) continue;
    mask[i] = 0; holePx++;
    if (seen[i]) continue;
    holes++; head = 0; tail = 0; q[tail++] = i; seen[i] = 1;
    while (head < tail){
      const p = q[head++], x = p % w, y = (p / w) | 0;
      const nbs = [x > 0 ? p-1 : -1, x < w-1 ? p+1 : -1, y > 0 ? p-w : -1, y < h-1 ? p+w : -1];
      for (const nb of nbs) if (nb >= 0 && px[nb] !== 0 && !reach[nb] && !seen[nb]){ seen[nb] = 1; q[tail++] = nb; }
    }
  }
  return { mask, holes, holePx };
}

// Messgrößen der Maske
function measure(cur){
  const { px, w, h } = cur, o = origFor(cur).data;
  const isObj = (x, y) => x >= 0 && y >= 0 && x < w && y < h && px[y*w+x] === 0;
  let touches = false, area = 0, sx = 0, sy = 0, n0 = 0, n90 = 0, n45 = 0, n135 = 0;
  const boundary = [];
  const cut = new Uint8ClampedArray(w * h * 4).fill(255);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y*w + x; if (px[i] !== 0) continue;
    area++; sx += x; sy += y;
    if (x === 0 || y === 0 || x === w-1 || y === h-1) touches = true;
    const j = i*4; cut[j] = o[j]; cut[j+1] = o[j+1]; cut[j+2] = o[j+2];
    // Übergänge Objekt → Hintergrund in 4 Richtungen (je von der Objektseite gezählt)
    const l = !isObj(x-1, y), r = !isObj(x+1, y), u = !isObj(x, y-1), d = !isObj(x, y+1);
    n0 += l + r; n90 += u + d;
    n45  += !isObj(x+1, y+1) + !isObj(x-1, y-1);
    n135 += !isObj(x+1, y-1) + !isObj(x-1, y+1);
    if (l || r || u || d) boundary.push(i);
  }
  // Cauchy-Crofton-Schätzer: P ≈ π/8 · (n0 + n90 + (n45 + n135)/√2)
  const perim = Math.PI / 8 * (n0 + n90 + (n45 + n135) / Math.SQRT2);
  const comps = area ? components(px, w, h).n : 0;
  const sph = perim ? 4 * Math.PI * area / (perim * perim) : 0;
  return { touches, sph, area, frac: area / (w*h), perim, cx: area ? sx/area : 0, cy: area ? sy/area : 0, boundary, cut, comps };
}

const countObj = px => { let c = 0; for (let i = 0; i < px.length; i++) if (px[i] === 0) c++; return c; };
const fmt = v => Math.round(v).toLocaleString('de-AT');
const num = (v, d) => v.toLocaleString('de-AT', { minimumFractionDigits: d, maximumFractionDigits: d });
const smart = v => num(v, v >= 100 ? 0 : v >= 10 ? 1 : 2);
const pct = (a, b) => (100 * a / b).toFixed(1).replace('.', ',') + ' %';
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };

/* ---------- Vorschau ---------- */
function computePreview(){
  const t = S.tool, cur = curState(); if (!t || !cur) return;
  if (t.name === 'threshold'){
    const out = new Uint8Array(cur.px.length), T = t.T;
    for (let i = 0; i < out.length; i++) out[i] = cur.px[i] <= T ? 0 : 255;
    t.mask = out; t.obj = countObj(out);
  } else if (t.name === 'morph'){
    t.mask = applyMorph(cur.px, cur.w, cur.h, t.op, t.r); t.obj = countObj(t.mask);
  } else if (t.name === 'cc' && !t.mask){
    const c = components(cur.px, cur.w, cur.h), oth = rgb(css('--other')); t.cc = c;
    const mask = new Uint8Array(c.lab.length).fill(255), rgba = new Uint8ClampedArray(c.lab.length * 4);
    for (let i = 0, j = 0; i < c.lab.length; i++, j += 4){
      const l = c.lab[i];
      if (!l){ rgba[j]=255; rgba[j+1]=255; rgba[j+2]=255; }
      else if (l === c.best){ rgba[j]=0; rgba[j+1]=0; rgba[j+2]=0; mask[i] = 0; }
      else { rgba[j]=oth[0]; rgba[j+1]=oth[1]; rgba[j+2]=oth[2]; }
      rgba[j+3] = 255;
    }
    t.mask = mask; t.rgba = rgba;
  } else if (t.name === 'fill' && !t.mask){
    const f = fillHoles(cur.px, cur.w, cur.h), hc = rgb(css('--hole'));
    const rgba = new Uint8ClampedArray(cur.px.length * 4);
    for (let i = 0, j = 0; i < cur.px.length; i++, j += 4){
      if (cur.px[i] === 0){ rgba[j]=0; rgba[j+1]=0; rgba[j+2]=0; }
      else if (f.mask[i] === 0){ rgba[j]=hc[0]; rgba[j+1]=hc[1]; rgba[j+2]=hc[2]; }
      else { rgba[j]=255; rgba[j+1]=255; rgba[j+2]=255; }
      rgba[j+3] = 255;
    }
    t.mask = f.mask; t.rgba = rgba; t.holes = f.holes; t.holePx = f.holePx;
  }
}

/* ---------- Ergebnis zeichnen ---------- */
function drawScale(s){
  const cur = curState(), o = origFor(cur); paintRGBA(o.data, o.width, o.height);
  const k = 1 / curS();
  vctx.lineCap = 'round';
  const line = () => { vctx.beginPath(); vctx.moveTo(s.a.x, s.a.y); vctx.lineTo(s.b.x, s.b.y); vctx.stroke(); };
  vctx.strokeStyle = '#fff'; vctx.lineWidth = 6*k; line();
  vctx.strokeStyle = css('--scale'); vctx.lineWidth = 3*k; line();
  for (const p of [s.a, s.b]){
    vctx.beginPath(); vctx.arc(p.x, p.y, 14*k, 0, 2*Math.PI);
    vctx.strokeStyle = '#fff'; vctx.lineWidth = 5*k; vctx.stroke();
    vctx.strokeStyle = css('--scale'); vctx.lineWidth = 2.5*k; vctx.stroke();
    vctx.beginPath(); vctx.arc(p.x, p.y, 2.2*k, 0, 2*Math.PI); vctx.fillStyle = css('--scale'); vctx.fill();
  }
}
function drawResult(t){
  if (t.scaleMode) return drawScale(t.scaleMode);
  const cur = curState(), m = t.m, { w, h } = cur;
  paintRGBA(m.cut, w, h);
  if (!m.area) return;
  const k = 1 / curS(), lp = Math.max(1, 2 * k);
  if (t.showP){
    vctx.fillStyle = css('--perim');
    for (const i of m.boundary){ const x = i % w, y = (i / w) | 0; vctx.fillRect(x + .5 - lp/2, y + .5 - lp/2, lp, lp); }
  }
  if (t.showC){
    const a = 20 * k, x = m.cx + .5, y = m.cy + .5;
    const cross = () => { vctx.beginPath(); vctx.moveTo(x - a, y); vctx.lineTo(x + a, y); vctx.moveTo(x, y - a); vctx.lineTo(x, y + a); vctx.stroke(); };
    vctx.lineCap = 'round';
    vctx.strokeStyle = '#fff'; vctx.lineWidth = 6 * k; cross();
    vctx.strokeStyle = css('--centroid'); vctx.lineWidth = 3 * k; cross();
  }
}

/* ---------- Aktionen ---------- */
function push(entry){ S.stack.push(entry); S.redo = []; S.tool = null; refresh(); }
function closeTool(){ S.tool = null; refresh(); }
function refresh(){ renderPanel(); redraw(); updateToolbar(); $('#stage').style.touchAction = curState() ? 'none' : 'auto'; }

$('#undo').addEventListener('click', () => {
  S.tool = null;
  if (S.stack.length > 1) S.redo.push(S.stack.pop());
  refresh();
});
$('#redo').addEventListener('click', () => {
  S.tool = null;
  if (S.redo.length) S.stack.push(S.redo.pop());
  refresh();
});
const cmp = $('#compare');
const cmpOn = e => { if (!curState()) return; e.preventDefault(); S.comparing = true; redraw(); };
const cmpOff = () => { if (!S.comparing) return; S.comparing = false; redraw(); };
cmp.addEventListener('pointerdown', cmpOn);
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => cmp.addEventListener(ev, cmpOff));
cmp.addEventListener('contextmenu', e => e.preventDefault());

function updateToolbar(){
  const cur = curState();
  $('#undo').disabled = S.stack.length <= 1;
  $('#redo').disabled = !S.redo.length;
  $('#compare').disabled = !cur;
  $('#info').innerHTML = cur ? `${cur.binary ? 'binär' : 'Graustufen'}<br>${cur.w} × ${cur.h} px` : '';
}

function rotate180(){
  const cur = curState(), px = new Uint8Array(cur.px.length), n = px.length;
  for (let i = 0; i < n; i++) px[n-1-i] = cur.px[i];
  Z.z = 1;
  push({ ...cur, px, rot: !cur.rot, label: '180° gedreht' });
}
function save(name){
  view.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

/* ---------- Bedienfeld ---------- */
const panel = $('#panel');
function stepper(){
  const cur = curState();
  const step = !cur ? 0 : !cur.binary ? 1 : (S.tool && S.tool.name === 'result') ? 3 : 2;
  return `<ol class="steps">${['Foto', 'Schwellwert', 'Aufräumen', 'Ergebnis'].map((s, i) =>
    `<li class="${i < step ? 'done' : i === step ? 'now' : ''}">${i < step ? '✓' : i + 1}<span class="lbl"> ${s}</span></li>`).join('')}</ol>`;
}
const setPanel = html => { panel.innerHTML = stepper() + html; };

function renderPanel(){
  const cur = curState(), t = S.tool;
  if (!cur){
    setPanel(`<div class="start">
      <label class="btn primary" for="sa-file">Foto aufnehmen oder auswählen</label>
      <p class="hint">Tipp: Querformat verwenden. Das Objekt sollte dunkel auf hellem Hintergrund sein und möglichst viel vom Bild ausfüllen.<br>Im Bild: mit zwei Fingern zoomen, mit einem Finger verschieben, Doppeltipp = ganzes Bild.</p></div>`);
    return;
  }
  if (!t){
    const bin = cur.binary;
    setPanel(`<div class="grid">
        <button data-act="threshold" ${bin ? 'disabled' : ''}>Schwellwert</button>
        <button data-act="morph" ${bin ? '' : 'disabled'}>Morphologie</button>
        <button data-act="cc" ${bin ? '' : 'disabled'}>Größte Komponente</button>
        <button data-act="fill" ${bin ? '' : 'disabled'}>Löcher füllen</button>
        <button data-act="result" class="wide ${bin ? 'primary' : ''}" ${bin ? '' : 'disabled'}>Ergebnis ansehen →</button>
        <button data-act="rotate">180° drehen</button>
        <label class="btn" for="sa-file">Neues Bild</label>
      </div>
      <p class="hint">${bin
        ? 'Binärbild: Objekt = schwarz. Mit Morphologie, größter Komponente oder Löcher füllen aufräumen, dann das Ergebnis ansehen. „Original ◐“ gedrückt halten zeigt das Foto mit der Maske in Rot.'
        : 'Erster Schritt: Mit einem Schwellwert ein Binärbild erzeugen. „Original ◐“ gedrückt halten zeigt das Foto.'}</p>
      <div class="history">Verlauf: ${S.stack.map(s => s.label).join(' → ')}</div>`);
    panel.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.act;
      if (a === 'threshold') openThreshold();
      else if (a === 'morph'){ S.tool = { name: 'morph', op: 'close', r: 2 }; renderPanel(); schedule(); }
      else if (a === 'cc'){ S.tool = { name: 'cc' }; renderPanel(); schedule(); }
      else if (a === 'fill'){ S.tool = { name: 'fill' }; renderPanel(); schedule(); }
      else if (a === 'result'){ S.tool = { name: 'result', showP: true, showC: true, m: measure(curState()) }; refresh(); }
      else if (a === 'rotate') rotate180();
    }));
    return;
  }
  ({ threshold: renderThreshold, morph: renderMorph, cc: renderCC, fill: renderFill, result: () => t.scaleMode ? renderScale() : renderResult() })[t.name]();
}

function actionsHTML(){ return `<div class="actions"><button id="cancel">Abbrechen</button><button class="primary" id="apply">Anwenden</button></div>`; }
function bindActions(onApply){ $('#cancel').addEventListener('click', closeTool); $('#apply').addEventListener('click', onApply); }

/* Schwellwert */
function openThreshold(){
  const cur = curState(), hist = histogram(cur.px), o = otsu(hist, cur.px.length);
  S.tool = { name: 'threshold', hist, otsu: o, T: o, log: false };
  renderPanel(); schedule();
}
function renderThreshold(){
  const t = S.tool;
  setPanel(`<h2>Schwellwert</h2>
    <canvas id="hist"></canvas>
    <div class="legend"><span><i class="sw" style="background:#3a3a38"></i>wird Objekt</span>
      <span><i class="sw" style="background:#c4c3bb"></i>Hintergrund</span>
      <span><i class="sw" style="background:var(--warn)"></i>Otsu-Vorschlag</span></div>
    <div class="row"><button id="tm" aria-label="kleiner">−</button>
      <input type="range" id="ts" min="0" max="255" value="${t.T}"><button id="tp" aria-label="größer">+</button></div>
    <div class="readout">T = <b id="tv"></b> · Pixel ≤ T werden schwarz · Objektanteil <b id="tf"></b></div>
    <div class="row"><button id="otsu">Otsu: T = ${t.otsu}</button>
      <label class="check"><input type="checkbox" id="log" ${t.log ? 'checked' : ''}> Log-Skala</label></div>
    ${actionsHTML()}`);
  const set = v => { t.T = Math.max(0, Math.min(255, v)); $('#ts').value = t.T; schedule(); };
  $('#ts').addEventListener('input', e => set(+e.target.value));
  $('#tm').addEventListener('click', () => set(t.T - 1));
  $('#tp').addEventListener('click', () => set(t.T + 1));
  $('#otsu').addEventListener('click', () => set(t.otsu));
  $('#log').addEventListener('change', e => { t.log = e.target.checked; drawHist(); });
  const hc = $('#hist'); let down = false;
  const fromX = e => { const r = hc.getBoundingClientRect(); set(Math.round((e.clientX - r.left) / r.width * 255)); };
  hc.addEventListener('pointerdown', e => { down = true; hc.setPointerCapture(e.pointerId); fromX(e); });
  hc.addEventListener('pointermove', e => { if (down) fromX(e); });
  hc.addEventListener('pointerup', () => { down = false; });
  bindActions(() => push({ ...curState(), px: t.mask, binary: true, label: `Schwellwert T=${t.T}` }));
}
function drawHist(){
  const t = S.tool, hc = $('#hist'); if (!hc || !t || t.name !== 'threshold') return;
  const dpr = window.devicePixelRatio || 1, W = hc.clientWidth, H = hc.clientHeight;
  hc.width = Math.round(W * dpr); hc.height = Math.round(H * dpr);
  const c = hc.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const f = t.log ? (v => Math.log1p(v)) : (v => v);
  let max = 0; for (let i = 0; i < 256; i++) max = Math.max(max, f(t.hist[i]));
  const bw = W / 256, pad = 4;
  for (let i = 0; i < 256; i++){
    const bh = max ? f(t.hist[i]) / max * (H - pad) : 0;
    c.fillStyle = i <= t.T ? '#3a3a38' : '#c4c3bb';
    c.fillRect(i * bw, H - bh, Math.max(1, bw), bh);
  }
  const ox = (t.otsu + .5) * bw;
  c.strokeStyle = css('--warn'); c.lineWidth = 2; c.setLineDash([4, 3]);
  c.beginPath(); c.moveTo(ox, 0); c.lineTo(ox, H); c.stroke(); c.setLineDash([]);
  const tx = (t.T + .5) * bw;
  c.strokeStyle = css('--accent'); c.lineWidth = 2;
  c.beginPath(); c.moveTo(tx, 0); c.lineTo(tx, H); c.stroke();
}

/* Morphologie */
const OPS = {
  erode:  ['Erosion',    'Schrumpft Objekte, entfernt kleine Punkte und dünne Verbindungen.'],
  dilate: ['Dilatation', 'Vergrößert Objekte, schließt kleine Lücken und Löcher.'],
  open:   ['Öffnen',     'Erosion, dann Dilatation: entfernt kleine Störungen, größere Formen bleiben fast unverändert.'],
  close:  ['Schließen',  'Dilatation, dann Erosion: füllt kleine Löcher und Spalten, Formen bleiben fast unverändert.']
};
function renderMorph(){
  const t = S.tool;
  setPanel(`<h2>Morphologie</h2>
    <div class="seg">${Object.keys(OPS).map(k => `<button data-op="${k}" aria-pressed="${t.op === k}">${OPS[k][0]}</button>`).join('')}</div>
    <p class="hint" id="opdesc" style="margin-top:0"></p>
    <div class="row"><button id="rm" aria-label="kleiner">−</button>
      <input type="range" id="rs" min="1" max="20" value="${t.r}"><button id="rp" aria-label="größer">+</button></div>
    <div class="se"><canvas id="se"></canvas><div>Strukturelement: Kreisscheibe, Radius <b id="rv"></b> px<br>Objektpixel: <b id="mo"></b></div></div>
    ${actionsHTML()}`);
  panel.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
    t.op = b.dataset.op; panel.querySelectorAll('[data-op]').forEach(x => x.setAttribute('aria-pressed', x === b)); schedule();
  }));
  const set = v => { t.r = Math.max(1, Math.min(20, v)); $('#rs').value = t.r; schedule(); };
  $('#rs').addEventListener('input', e => set(+e.target.value));
  $('#rm').addEventListener('click', () => set(t.r - 1));
  $('#rp').addEventListener('click', () => set(t.r + 1));
  bindActions(() => push({ ...curState(), px: t.mask, label: `${OPS[t.op][0]} r=${t.r}` }));
}
function drawSE(r){
  const cv = $('#se'); if (!cv) return;
  const n = 2*r + 1, cell = Math.max(2, Math.floor(84 / n)), dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = n * cell + 'px'; cv.width = cv.height = Math.round(n * cell * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = '#fff'; c.fillRect(0, 0, n*cell, n*cell);
  c.fillStyle = css('--accent');
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (dx*dx + dy*dy <= r*r) c.fillRect((dx+r)*cell, (dy+r)*cell, cell - (cell > 3 ? 1 : 0), cell - (cell > 3 ? 1 : 0));
}

/* Ergebnis */
function renderResult(){
  const t = S.tool, m = t.m, cur = curState(), sc = S.scale, L = sc ? sc.mmPerPx : 0;
  if (!m.area){
    setPanel(`<h2>Ergebnis</h2><p class="hint warn">Die Maske enthält keine Objektpixel.</p>
      <div class="actions"><button id="back" class="wide">← Zur Bearbeitung</button></div>`);
    $('#back').addEventListener('click', closeTool); return;
  }
  const area = sc ? `${smart(m.area * L * L)} mm²` : `${fmt(m.area)} px`;
  const per  = sc ? `≈ ${smart(m.perim * L)} mm` : `≈ ${fmt(m.perim)} px`;
  const cen  = sc ? `x = ${smart(m.cx * L)}, y = ${smart(m.cy * L)} mm` : `x = ${fmt(m.cx)}, y = ${fmt(m.cy)}`;
  setPanel(`<h2>Ergebnis</h2>
    <div class="meas">
      <div class="mrow"><i class="sw" style="background:#3a3a38"></i><span>Fläche</span>
        <span class="mval">${area} · ${pct(m.area, cur.w * cur.h)}</span></div>
      <button class="mrow" id="mP" aria-pressed="${t.showP}"><i class="sw" style="background:var(--perim)"></i><span>Umfang</span>
        <span class="mval">${per}</span></button>
      <button class="mrow" id="mC" aria-pressed="${t.showC}"><i class="sw" style="background:var(--centroid)"></i><span>Schwerpunkt</span>
        <span class="mval">${cen}</span></button>
      <div class="mrow"><i></i><span>Sphärizität</span><span class="mval">${num(m.sph, 2)}</span></div>
    </div>
    ${m.touches ? `<p class="hint warn">⚠ Das Objekt berührt den Bildrand. Vermutlich liegt ein Teil außerhalb des Fotos, dann sind Fläche, Umfang, Schwerpunkt und Sphärizität verfälscht. Tipp: mit etwas Abstand zum Rand fotografieren.</p>` : ''}
    ${m.comps > 1 ? `<p class="hint warn">⚠ Die Maske besteht aus ${m.comps} Teilen; alle Werte gelten für alle Teile zusammen. Tipp: vorher „Größte Komponente“ anwenden.</p>` : ''}
    <div class="actions">
      <button id="scale">${sc ? 'Maßstab ändern' : 'Maßstab setzen…'}</button>
      <button id="copy">Werte kopieren</button>
      <button id="back">← Bearbeiten</button>
      <button class="primary" id="save">Ansicht speichern</button>
    </div>
    <p class="copied" id="copied"></p>
    <p class="hint">${sc ? `Maßstab: 1 mm ≙ ${num(1 / L, 2)} px.` : 'Kein Maßstab gesetzt: alle Werte in Pixeln des verkleinerten Bildes.'}
      Umfang und Schwerpunkt antippen blendet ihre Markierung ein oder aus.</p>
    <p class="hint"><b>Umfang:</b> geschätzt aus den Objekt/Hintergrund-Übergängen in vier Richtungen (Cauchy-Crofton).
      <b>Schwerpunkt:</b> Mittelwert der Pixelkoordinaten, Ursprung links oben.
      <b>Sphärizität</b> = 4π · Fläche / Umfang²: 1 für einen perfekten Kreis, kleiner für längliche oder zerklüftete Formen.</p>`);
  const toggle = (id, key) => $(id).addEventListener('click', e => {
    t[key] = !t[key]; e.currentTarget.setAttribute('aria-pressed', t[key]); redraw();
  });
  toggle('#mP', 'showP'); toggle('#mC', 'showC');
  $('#back').addEventListener('click', closeTool);
  $('#save').addEventListener('click', () => save('ergebnis.png'));
  $('#scale').addEventListener('click', openScale);
  $('#copy').addEventListener('click', async () => {
    const f = (v, d) => v.toFixed(d).replace('.', ',');
    const vals = sc
      ? [f(m.area * L * L, 2), f(m.perim * L, 2), f(m.sph, 3), f(m.cx * L, 2), f(m.cy * L, 2), 'mm']
      : [f(m.area, 0), f(m.perim, 1), f(m.sph, 3), f(m.cx, 1), f(m.cy, 1), 'px'];
    const text = vals.join('\t');
    const out = $('#copied');
    if (await copyText(text)) out.textContent = '✓ Kopiert (Tab-getrennt): Fläche · Umfang · Sphärizität · x · y · Einheit';
    else out.textContent = 'Kopieren nicht möglich, bitte von Hand abschreiben: ' + vals.join(' | ');
  });
}
async function copyText(s){
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = s; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}

/* Maßstab */
const parseLen = v => parseFloat(String(v).replace(',', '.'));
function openScale(){
  const t = S.tool, cur = curState(), sc = S.scale;
  let a, b;
  if (sc){
    a = { ...sc.a }; b = { ...sc.b };
    if (sc.rot !== cur.rot){ a = { x: cur.w - a.x, y: cur.h - a.y }; b = { x: cur.w - b.x, y: cur.h - b.y }; }
  } else { a = { x: cur.w * .3, y: cur.h * .5 }; b = { x: cur.w * .7, y: cur.h * .5 }; }
  t.scaleMode = { a, b, mm: sc ? sc.mm : '' };
  refresh();
}
function renderScale(){
  const t = S.tool, s = t.scaleMode;
  setPanel(`<h2>Maßstab setzen</h2>
    <p class="hint" style="margin-top:0">Ziehe die beiden Punkte an die Enden einer Strecke, deren Länge du kennst (z. B. 5 cm auf einem Lineal), und gib diese Länge ein. Auf einem Punkt ansetzen verschiebt den Punkt, woanders ansetzen verschiebt das Bild. Für mehr Genauigkeit mit zwei Fingern hineinzoomen.</p>
    <div class="readout">Strecke im Bild: <b id="spx"></b> px</div>
    <div class="row"><label for="sa-smm">Wirkliche Länge:</label>
      <input id="sa-smm" name="sa-smm" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 50" value="${s.mm}"><span>mm</span></div>
    <div class="readout" id="sres"></div>
    <div class="actions">
      ${S.scale ? '<button id="sdel" class="wide">Maßstab entfernen</button>' : ''}
      <button id="cancel">Abbrechen</button><button class="primary" id="apply">Übernehmen</button>
    </div>`);
  $('#sa-smm').addEventListener('input', e => { s.mm = e.target.value; updateScale(); });
  $('#cancel').addEventListener('click', () => { t.scaleMode = null; refresh(); });
  $('#apply').addEventListener('click', () => {
    const len = Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y), mm = parseLen(s.mm);
    if (!(mm > 0) || len < 5) return;
    S.scale = { mmPerPx: mm / len, a: { ...s.a }, b: { ...s.b }, rot: curState().rot, mm: s.mm };
    t.scaleMode = null; refresh();
  });
  if (S.scale) $('#sdel').addEventListener('click', () => { S.scale = null; t.scaleMode = null; refresh(); });
  updateScale();
}
function updateScale(){
  const s = S.tool && S.tool.scaleMode; if (!s || !$('#spx')) return;
  const len = Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y), mm = parseLen(s.mm), ok = mm > 0 && len >= 5;
  $('#spx').textContent = num(len, 1);
  $('#sres').textContent = len < 5 ? 'Die Punkte liegen zu nah beieinander.'
    : ok ? `→ 1 mm ≙ ${num(len / mm, 2)} px` : 'Bitte die Länge in mm eingeben.';
  $('#apply').disabled = !ok;
}
/* ---------- Zoom und Gesten ---------- */
// Bildschirmposition = (Z.x, Z.y) + Bildpixel · s, mit s = fitS() · Z.z (Z.z ≥ 1: nie kleiner als das ganze Bild)
const MAX_PX = 12;                                   // höchstens 12 Bildschirmpunkte pro Bildpixel
const stage = $('#stage'), zbtn = $('#zbtn');
function fitS(){ const cur = curState(); return cur ? Math.min(stage.clientWidth / cur.w, stage.clientHeight / cur.h) : 1; }
function curS(){ return fitS() * Z.z; }
const zMax = () => Math.max(1, MAX_PX / fitS());
function clampZ(){
  const cur = curState(); if (!cur) return;
  Z.z = Math.min(Math.max(1, Z.z), zMax());
  const s = curS(), dw = cur.w * s, dh = cur.h * s, SW = stage.clientWidth, SH = stage.clientHeight;
  Z.x = dw <= SW ? (SW - dw) / 2 : Math.min(0, Math.max(SW - dw, Z.x));
  Z.y = dh <= SH ? (SH - dh) / 2 : Math.min(0, Math.max(SH - dh, Z.y));
}
function applyZoom(){
  const cur = curState(); if (!cur) return;
  clampZ(); const s = curS();
  view.style.width = cur.w * s + 'px'; view.style.height = cur.h * s + 'px';
  view.style.transform = `translate(${Z.x}px, ${Z.y}px)`;
  view.style.imageRendering = s >= 1 ? 'pixelated' : 'auto';
  stage.style.cursor = S.tool && S.tool.scaleMode ? 'crosshair' : Z.z > 1.01 ? 'grab' : '';
  zbtn.hidden = Z.z < 1.01;
  zbtn.textContent = `⤢ ${num(Z.z, 1)}×`;
}
function zoomAt(px, py, z){
  const s0 = curS(), ix = (px - Z.x) / s0, iy = (py - Z.y) / s0;
  Z.z = Math.min(Math.max(1, z), zMax());
  const s1 = curS(); Z.x = px - ix * s1; Z.y = py - iy * s1;
}
let annoPending = false;
function onZoom(){
  applyZoom();
  // Markierungen (Umfang, Schwerpunkt, Maßstab) haben feste Bildschirmgröße → neu zeichnen
  if (S.tool && S.tool.name === 'result' && !annoPending){
    annoPending = true; requestAnimationFrame(() => { annoPending = false; redraw(); });
  }
}
zbtn.addEventListener('click', () => { Z.z = 1; onZoom(); });

const ptrs = new Map(); let G = null, lastTap = null;
const stagePt = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const toImg = e => { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * view.width, y: (e.clientY - r.top) / r.height * view.height }; };
function hitHandle(s, p){
  const k = curS(), sa = { x: Z.x + s.a.x * k, y: Z.y + s.a.y * k }, sb = { x: Z.x + s.b.x * k, y: Z.y + s.b.y * k };
  const da = dist(p, sa), db = dist(p, sb), R = 30;
  if (Math.min(da, db) > R) return null;
  return da <= db ? s.a : s.b;
}
function startPan(id, p){ G = { mode: 'pan', id, sx: p.x, sy: p.y, x0: Z.x, y0: Z.y, moved: false }; }
function startPinch(){
  const [a, b] = [...ptrs.values()], m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, s0 = curS();
  G = { mode: 'pinch', d0: dist(a, b) || 1, z0: Z.z, ix: (m.x - Z.x) / s0, iy: (m.y - Z.y) / s0 };
}
stage.addEventListener('pointerdown', e => {
  if (!curState() || e.target === zbtn || e.target === fsbtn) return;
  e.preventDefault(); stage.setPointerCapture(e.pointerId);
  const p = stagePt(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 1){
    const s = S.tool && S.tool.scaleMode, h = s && !S.comparing ? hitHandle(s, p) : null;
    if (h){ const ip = toImg(e); G = { mode: 'handle', id: e.pointerId, h, dx: h.x - ip.x, dy: h.y - ip.y }; }
    else startPan(e.pointerId, p);
  } else if (ptrs.size === 2) startPinch();
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !G) return;
  const p = stagePt(e); ptrs.set(e.pointerId, p);
  if (G.mode === 'handle' && e.pointerId === G.id){
    const ip = toImg(e), cur = curState();
    G.h.x = Math.max(0, Math.min(cur.w, ip.x + G.dx)); G.h.y = Math.max(0, Math.min(cur.h, ip.y + G.dy));
    redraw(); updateScale();
  } else if (G.mode === 'pan' && e.pointerId === G.id){
    if (Math.hypot(p.x - G.sx, p.y - G.sy) > 8) G.moved = true;
    Z.x = G.x0 + p.x - G.sx; Z.y = G.y0 + p.y - G.sy; onZoom();
  } else if (G.mode === 'pinch' && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    Z.z = Math.min(Math.max(1, G.z0 * dist(a, b) / G.d0), zMax());
    const s1 = curS(); Z.x = m.x - G.ix * s1; Z.y = m.y - G.iy * s1; onZoom();
  }
});
function endPointer(e){
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (G && G.mode === 'pan' && G.id === e.pointerId && !G.moved && e.type === 'pointerup'){
    // Doppeltipp: hineinzoomen bzw. zurück zum ganzen Bild
    if (lastTap && e.timeStamp - lastTap.t < 330 && dist(p, lastTap.p) < 30){
      if (Z.z > 1.01) Z.z = 1; else zoomAt(p.x, p.y, 3);
      onZoom(); lastTap = null;
    } else lastTap = { t: e.timeStamp, p };
  }
  if (ptrs.size === 1){ const [[id, q]] = [...ptrs.entries()]; startPan(id, q); G.moved = true; }
  else if (!ptrs.size) G = null;
}
['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, endPointer));
stage.addEventListener('wheel', e => {
  if (!curState()) return; e.preventDefault();
  const p = stagePt(e); zoomAt(p.x, p.y, Z.z * Math.exp(-e.deltaY * 0.0015)); onZoom();
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => stage.addEventListener(ev, e => e.preventDefault()));
stage.addEventListener('contextmenu', e => e.preventDefault());
if (window.ResizeObserver) new ResizeObserver(() => onZoom()).observe(stage);

function updateReadouts(){
  const t = S.tool, cur = curState(); if (!t || !cur) return;
  if (t.name === 'threshold'){
    $('#tv').textContent = t.T; $('#tf').textContent = pct(t.obj, cur.px.length); drawHist();
  } else if (t.name === 'morph'){
    $('#rv').textContent = t.r; $('#opdesc').textContent = OPS[t.op][1];
    $('#mo').textContent = `${fmt(countObj(cur.px))} → ${fmt(t.obj)}`;
    drawSE(t.r);
  } else if (t.name === 'cc' && t.cc){
    const c = t.cc, tot = c.sizes.reduce((a, b) => a + b, 0);
    $('#ccinfo').innerHTML = c.n
      ? `${c.n} Komponente${c.n === 1 ? '' : 'n'} gefunden. Größte: <b>${fmt(c.sizes[c.best])} px</b> (${pct(c.sizes[c.best], tot)} der Objektpixel).`
      : 'Keine Objektpixel vorhanden.';
    $('#apply').disabled = !c.n;
  } else if (t.name === 'fill' && t.mask){
    $('#fillinfo').innerHTML = t.holes
      ? `${t.holes} Loch${t.holes === 1 ? '' : 'er'} gefunden, zusammen <b>${fmt(t.holePx)} px</b>.`
      : 'Keine Löcher gefunden.';
    $('#apply').disabled = !t.holes;
  }
}

window.addEventListener('resize', () => { if (S.tool && S.tool.name === 'threshold') drawHist(); });
refresh();
})();
</script>
